<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f3f0e8">
  <title>OpenRUNN</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <div class="screen">
        <!-- gear icon -->
        <div class="header">
        <button class="btn-gear" type="button" aria-label="Settings">
            <svg viewBox="0 0 24 24">
            <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6-3.6z"/>
            </svg>
        </button>
        </div>

        <!-- Distance metric -->
        <div class="card card-dist">
        <div class="title">Distance</div>
        <div class="value" id="distance">00.00</div>
        <div class="unit">KILOMETERS</div>
        </div>

        <!-- Pace metric -->
        <div class="card card-pace">
        <div class="title">Pace</div>
        <div class="value" id="pace">--:--</div>
        <div class="unit">MIN / KM</div>
        </div>

        <!-- Time metric -->
        <div class="card card-time">
        <div class="title">Time</div>
        <div class="value" id="duration">00:00:00</div>
        </div>

        <!-- Controls -->
        <div class="controls">
        <button class="btn btn-start-pause" id="start-pause" type="button" aria-label="Start">
          <svg class="icon-start" width="20" height="20" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg class="icon-pause" width="20" height="20" viewBox="0 0 24 24" hidden><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            <svg class="icon-resume" width="20" height="20" viewBox="0 0 24 24" hidden><path d="M8 5v14l11-7z"/></svg>
        </button>

        <button class="btn btn-stop" id="stop" type="button" disabled>
            <svg class="icon-stop" width="18" height="18" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
        </button>
        </div>
    </div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
